<!DOCTYPE html>
<html lang="hu">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
	<title>Útépítés</title>
</head>
<body>
	<div class="container text-center">
		<header class="row">
			<h1 class="col-12 bg-primary p-3 text-light">Útépítés - 2009. 10. 26.</h1>
		</header>
		<div class="row">
			<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav">
				<li class="nav-item">
					<a class="nav-link" href="#" onclick="inditas(2)">Feladat 2</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" href="#" onclick="inditas(3)">Feladat 3</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" href="#" onclick="inditas(4)">Feladat 4</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" href="#" onclick="inditas(5)">Feladat 5</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" href="#" onclick="inditas(6)">Feladat 6</a>
				</li>
				</ul>
			</div>
		</nav>
		</div>
		<main class="row" id="main">
			<h2 class="col-12">Még semmi</h2>
			<article class="col-12">
				
			</article>
		</main>
		<footer class="row bg-primary text-light p-3">
			<p>&copy; Nem vállalom a nevem - 2026. 10. 19.</p>
		</footer>
	</div>

	<script>
	let json = [];
	fetch("api.php")
		.then(x => x.json())
		.then(data => json = data);

	function inditas(szam) {
		document.querySelector("main h2").innerHTML = szam + ". Feladat";
		let article = document.querySelector("main article");

		if (szam === 2) {
			article.innerHTML = `
				<div class="my-3">
					<label for="sorszam" class="form-label">Adja meg az autó sorszámát:</label>
					<input type="number" id="sorszam" class="form-control d-inline-block w-auto">
					<button class="btn btn-primary ms-2" onclick="feladat2()">Küldés</button>
				</div>
				<div id="eredmeny" class="mt-3 fs-5"></div>`;
		} else if (szam === 3) {
			article.innerHTML = `
				<div class="my-3">
					<button class="btn btn-primary" onclick="feladat3()">Utolsó 2 autó különbsége</button>
				</div>
				<div id="eredmeny" class="mt-3 fs-5"></div>`;
		} else if (szam === 4) {
			article.innerHTML = `
				<h3 class="my-3">A forgalom statisztikája órai bontásban</h3>
				<table class="table table-striped table-bordered w-auto mx-auto"></table>`;
			feladat4();
		} else if (szam === 5) {
			article.innerHTML = `<div id="f5"></div>`;
			feladat5();
		}
	}

	function feladat2() {
		let sorszam = parseInt(document.querySelector("#sorszam").value);
		let eredmenyDiv = document.querySelector("#eredmeny");
		let adatok = json[sorszam - 1];
		let varosNev = adatok.varos;
		eredmenyDiv.innerHTML = `A ${sorszam}. autó ${varosNev} felé haladt.`;
	}

	function feladat3() {
		let felso = json.filter(item => item.varos === "F");
		if (felso.length < 2) return;

		let u1 = felso[felso.length - 2];
		let u2 = felso[felso.length - 1];

		let mp1 = Number(u1.ora) * 3600 + Number(u1.perc) * 60 + Number(u1.masodperc ?? u1.mp ?? 0);
		let mp2 = Number(u2.ora) * 3600 + Number(u2.perc) * 60 + Number(u2.masodperc ?? u2.mp ?? 0);

		let kulonbsegMp = mp2 - mp1;

		let ora = Math.floor(kulonbsegMp / 3600);
		let perc = Math.floor((kulonbsegMp % 3600) / 60);
		let mp = kulonbsegMp % 60;

		let idoSzoveg = ora > 0 
			? `${ora} óra ${perc} perc ${mp} másodperc` 
			: `${perc} perc ${mp} másodperc`;

		document.querySelector("#eredmeny").innerHTML = 
			`A Felső város irányába tartó utolsó két jármű ${idoSzoveg} különbséggel érte el az útszakasz kezdetét.`;
	}

	function feladat4() {
		const table = document.querySelector("main article table");
		let thead = document.createElement("thead");
		let tr = document.createElement("tr");
		["Óra", "Alsóváros (A)", "Felsőváros (F)"].forEach(e => {
			let th = document.createElement("th");
			th.innerHTML = e;
			tr.appendChild(th);
		});
		thead.appendChild(tr);
		table.appendChild(thead);

		let tbody = document.createElement("tbody");

		let orak = [...new Set(json.map(item => Number(item.ora)))].sort((a, b) => a - b);

		orak.forEach(o => {
			let aDb = json.filter(item => Number(item.ora) === o && item.varos === "A").length;
			let fDb = json.filter(item => Number(item.ora) === o && item.varos === "F").length;

			let row = document.createElement("tr");
			row.innerHTML = `<td>${o}</td><td>${aDb}</td><td>${fDb}</td>`;
			tbody.appendChild(row);
		});

		table.appendChild(tbody);
	}

	function feladat5()
	{
		let rendezett = json.toSorted((a,b) => a.ido - b.ido).slice(0,10);
		console.log(rendezett);
		let ol = document.createElement("ol");
		rendezett.forEach(item => {
			let li = document.createElement("li");
			li.innerHTML = item.ido + "s Sebesség: " + item.ido/1000 + " m/s A város" + item.varos
		});
		document.getElementById("f5").innerHTML = ol;
	}

	function feladat6()
	{

	}
	</script>
</body>
</html>
