<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Űrlap doga</title>
</head>
<body>
    <!--Innen van:
    https://getbootstrap.com/docs/5.0/examples/headers/-->
    <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
      <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-dark text-decoration-none">
        <svg class="bi me-2" width="40" height="32"><use xlink:href="#bootstrap"></use></svg>
        <span class="fs-4">Adatbekérés</span>
      </a>
    </header>
    <div class="container">
        <div class="row text-center">
            <h1>Név és dátum bekérés</h1>
                <div class="col-9 form-group">
                    <label for="nev">Adj meg egy nevet!</label>
                    <input type="text" name="nev" id="nev" class="m-4 form-control">
                    <label for="datum">Adj meg egy születési dátumot!</label>
                    <input type="date" name="datum" id="datum" class="m-4 form-control">
                    <button onclick="kuldes()" class="m-4">Küldés</button>
                </div>
                <div class="col-3" id="ideirjad">
                    <table id="tablazat" class="table table-striped">
                        <thead>Táblázat</thead>
                        <tbody class="table-striped" id="ide">
                        <tr><td>Első adat</td></tr>
                        </tbody>
                    </table>
                </div>
        </div>
    </div>
    <!--Innen van:
    //https://getbootstrap.com/docs/5.3/examples/footers/-->
    <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"> <div class="col-md-4 d-flex align-items-center"> <a href="/" class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1" aria-label="Bootstrap"> <svg class="bi" width="30" height="24" aria-hidden="true"><use xlink:href="#bootstrap"></use></svg> </a> <span class="mb-3 mb-md-0 text-body-secondary">2026. 10. 07.</span> </div> <ul class="nav col-md-4 justify-content-end list-unstyled d-flex"> <li class="ms-3"><a class="text-body-secondary" href="#" aria-label="Instagram"><svg class="bi" width="24" height="24" aria-hidden="true"><use xlink:href="#instagram"></use></svg></a></li> <li class="ms-3"><a class="text-body-secondary" href="#" aria-label="Facebook"><svg class="bi" width="24" height="24"><use xlink:href="#facebook"></use></svg></a></li> </ul> </footer>
    <script>
        let eltarolt = JSON.parse(localStorage.getItem('adatok2')) || [];
        localStorage.removeItem("adatok2");
        console.log(eltarolt);
        
        //console.log(adatok);
        
        let szamlalo = 1;
        function kuldes()
        {
            let nev = document.getElementById("nev").value;
            let datum = document.getElementById("datum").value;
            const ujAdat = {
            sorszam: szamlalo,
            nev: nev,
            datum: datum
            };
            szamlalo++;
            console.log(eltarolt);
            eltarolt.push(ujAdat);
            //console.log(nev,datum);
            localStorage.setItem('adatok2',JSON.stringify(eltarolt));
            //console.log(JSON.parse(localStorage.getItem('nev')));
            //console.log(JSON.parse(localStorage.getItem('datum')));
            console.log(eltarolt);
            //localStorage.removeItem("adatok2");
            tablazat();
        }

        function tablazat()
        {
            let i = 0;
            eltarolt.forEach(e => {
                i++;
                document.getElementById("ide").innerHTML += i+"." +  JSON.stringify(e) + '<tr>';
            })
            //document.getElementById("ide").innerHTML += '<tr><td>' + eltarolt[0] + '</td>' + eltarolt[1] + '</tr>'
        }
    </script>
</body>
</html>
