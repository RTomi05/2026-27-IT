<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5" style="max-width: 400px;">
  <div class="input-group mb-3">
    <input id="bevitel" type="text" class="form-control">
    <button class="btn btn-primary" onclick="hozzaad()">Hozzáadás</button>
  </div>
  
  <ul id="lista" class="list-group"></ul>

  <script>
    // 1. BETÖLTÉS
    let tomb = JSON.parse(localStorage.getItem('elemek')) || [];

    tomb.forEach(elem => {
      document.getElementById('lista').innerHTML += '<li class="list-group-item">' + elem + '</li>';
    });

    // 2. HOZZÁADÁS ÉS MENTÉS
    function hozzaad() {
      let elem = document.getElementById('bevitel').value;

      tomb.push(elem);
      localStorage.setItem('elemek', JSON.stringify(tomb));
      
      document.getElementById('lista').innerHTML += '<li class="list-group-item">' + elem + '</li>';
      document.getElementById('bevitel').value = '';
    }
  </script>

</body>
</html>
