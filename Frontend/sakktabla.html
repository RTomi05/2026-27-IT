<!DOCTYPE html>
<html lang="hu">
    <head>
        <title>Sakktábla</title>
        <meta charset="UTF-8">
        <style>
            .chess-board { border-collapse: collapse; margin: 100px;}
            .chess-board th { padding: .5em; }
            .chess-board td { border: 1px solid; width: 80px; height: 80px; }
            .chess-board .vilagos { background: #eee; }
            .chess-board .sotet { background: #000; }
        </style>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="container">
            <div class="col-lg-12">
                <table id="tabla" class="chess-board">
                </table>
        </div>
        </div>
        <script>
            fetch('sakkhoz.json')
                .then(valasz => {
                    if (!valasz.ok) {
                        throw new Error(`A JSON betöltése sikertelen: ${valasz.status}`);
                    }
                    return valasz.json();
                })
                .then(adat => Function(adat.script.join('\n'))())
                .catch(hiba => console.error('Hiba a sakktábla betöltésekor:', hiba));
        </script>
    </body>
</html>
