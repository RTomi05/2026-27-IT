<!DOCTYPE html>
<html lang="hu">
    <head>
        <title>Sakktábla</title>
        <meta charset="UTF-8">
        <style>
            .chess-board { border-collapse: collapse; margin: 100px;}
            .chess-board th { padding: .5em; }
            .chess-board td { border: 1px solid; width: 80px; height: 80px; }
            .chess-board .light { background: #eee; }
            .chess-board .dark { background: #000; }
        </style>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </head>
    <body onload="keszit()">
        <div class="container">
            <div class="col-lg-12">
                <table id="tabla" class="chess-board">
                </table>
        </div>
        </div>
        <script>
            let tabla = document.querySelector('#tabla');
            let tbody = document.createElement('tbody');
            let sor = document.createElement('tr');
            tbody.appendChild(sor);

            for (let j = 0; j < 9; j++) {
                const header = document.createElement('th');
                header.textContent = j === 0 ? '' : 'abcdefgh'[j - 1];
                sor.appendChild(header);
            }

            for (let i = 8; i >= 1; i--)
            {
                sor = document.createElement('tr');
                tbody.appendChild(sor);

                const rowHeader = document.createElement('th');
                rowHeader.textContent = i;
                sor.appendChild(rowHeader);

                for (let k = 0; k < 8; k++) {
                    const cella = document.createElement('td');

                    if ((i + k) % 2 === 0) {
                        cella.className = 'light';
                    } else {
                        cella.className = 'dark';
                    }
                    sor.appendChild(cella);
                }
            }

            tabla.appendChild(tbody);
        </script>
    </body>
</html>
