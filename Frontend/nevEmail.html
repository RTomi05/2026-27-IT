<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Űrlap</title>
</head>
<body>
    <div class="container">
        <div class="row col-lg-12">
            <div class="text-center">
                <h1 class="text-center">Űrlap</h1>
                    <div>
                        <label for="">Név:</label>
                        <input type="text" class="bg-info" id="nev" name="nev">
                    </div>
                <div class="m-3">
                    <label for="">Email:</label>
                    <input type="email" class="bg-info" id="email" name="email"><br>
                    <button type="button" class="btn bg-success mt-3" id="kuldes" onclick="bekuld()">Beküld</button>
                    <button type="button" class="btn bg-success mt-3" id="kuldes" onclick="torles()">LocalStorage törlése</button>
                </div>
                <div class="row mt-5">
                    <div class="col-md-5">
                        <div>
                            <div>
                                <table class="table table-bordered mb-0 align-middle">
                                    <thead class="table-warning">
                                        <tr>
                                            <th>Név</th>
                                            <th>Email</th>
                                        </tr>
                                    </thead>
                                    <tbody id="adatok"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>

        console.log(localStorage.getItem("nev"));
        const adatok = JSON.parse(localStorage.getItem("adatok") || "[]");
        const tabla = document.getElementById('adatok');
        const nevInput = document.getElementById('nev');
        const emailInput = document.getElementById('email');
        const kuldes = document.getElementById('kuldes');
        let selectedRowIndex = null;

        function renderTabla() {
            tabla.innerHTML = '';

            adatok.forEach((adat, index) => {
                const row = tabla.insertRow();
                row.dataset.index = index;

                const cella1 = row.insertCell(0);
                const cella2 = row.insertCell(1);

                cella1.textContent = adat[0];
                cella2.textContent = adat[1];

                row.addEventListener('click', () => {
                    selectedRowIndex = Number(row.dataset.index);
                    nevInput.value = adat[0];
                    emailInput.value = adat[1];
                    kuldes.textContent = 'Mentés';
                });
            });
        }

        function torolInputok() {
            nevInput.value = '';
            emailInput.value = '';
            selectedRowIndex = null;
            kuldes.textContent = 'Beküld';
        }

        function bekuld() {
            const nev = nevInput.value.trim();
            const email = emailInput.value.trim();

            if (selectedRowIndex !== null) {
                adatok[selectedRowIndex] = [nev, email];
            } else {
                adatok.push([nev, email]);
            }

            localStorage.setItem('nev', nev);
            //localStorage.setItem('email', email);
            //localStorage.setItem('adatok', JSON.stringify(adatok));

            renderTabla();
            torolInputok();
        }

        function sutiKi() {
            let x = document.cookie;
            console.log(x);
        }

        function torles()
        {
            localStorage.clear();
            console.log(localStorage.getItem("nev"));
        }

        renderTabla();
    </script>
</body>
</html>
