<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Pepa Telefon</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-4"></div>
                <div class="col-4 container">
                    <div class="row">
                        <div class="col-12 bg-warning text-danger display-4" id="kijelzo">&nbsp</div>
                    </div>
                    <div class="row" id="billentyuzet">
                    </div>
                    <div class="row">
                        <div class="col-5 bg-danger text-white p-4 text-center" onclick="hivasLerak()">Lerak</div>
                        <div class="col-2"></div>
                        <div class="col-5 bg-success text-white p-4 text-center" onclick="hivasIndit()">Hívás</div>
                    </div>   
            </div>
            <div class="col-4 container">
                <div class="row">
                    <div class="col-3">Hívás ideje:</div>
                    <div class="col-3" id="idoKijelzo">majdide</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        billentyuzet();
        function billentyuzet()
        {
            let b = document.getElementById("billentyuzet");
            for(let i = 1; i < 10; i++)
            {
                b.appendChild(egyGomb(i));
            }
            b.appendChild(egyGomb(""));
            b.appendChild(egyGomb(0));
            b.appendChild(egyGomb(""));
        }

        function egyGomb(felirat)
        {
            let gomb = document.createElement("div");
            gomb.className = "col-4 bg-info border rounded p-3 text-white text-center"
            gomb.innerHTML = felirat;

            gomb.addEventListener("click",e =>{
                //console.log(felirat,e);
                if(felirat !== "")
            {
                if(document.getElementById("kijelzo").innerHTML === "&nbsp;")
                {
                    document.getElementById("kijelzo").innerHTML = "";
                }
                document.getElementById("kijelzo").innerHTML += felirat;
            }
            })
            return gomb;
        }

        let startTime = 0;
        function hivasIndit()
        {
            console.log("Hívás indítása");
            startTime = Date.now();
            console.log(new Date(startTime).toLocaleString("hu-HU"));
        }

        function hivasLerak()
        {
            console.log("Hívás lerakása");
            callTime = Date.now() - startTime;
            
            const date = new Date(callTime);
            const time = date.toLocaleTimeString('en-GB', {
                timeZone: "UTC",
                hour: "2-digit",
                minute:"2-digit",
                second:"2-digit"
            });
            console.log(time);
            let hivasInfo = {"kezdet":new Date(startTime).toLocaleString("hu-HU"),
                "hivottSzam":document.getElementById("kijelzo").innerHTML,
                "hivasHossz":time
            }
            console.log(hivasInfo);
            document.getElementById("kijelzo").innerHTML = "&nbsp";

            let lista = JSON.parse(localStorage.getItem("lista")) ?? [];
            lista.push(hivasInfo);

            localStorage.setItem("lista",JSON.stringify(lista));

            console.log(localStorage.getItem("lista"));
        }
    </script>
</body>
</html>
