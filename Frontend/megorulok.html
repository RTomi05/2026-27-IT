<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Űrlap doga</title>
</head>
<body>
    <header>Ih</header>
    <div class="container">
        <div class="row text-center">
            <div class="col-12">
                <div class="col-9">
                    <label for="nev">Adj meg egy nevet!</label>
                    <input type="text" name="nev" id="nev" class="m-4">
                    <label for="datum">Adj meg egy születési dátumot!</label>
                    <input type="date" name="datum" id="datum" class="m-4">
                    <button onclick="kuldes()" class="m-4">Küldés</button>
                </div>
                <div class="col-3">Az</div>
            </div>
        </div>
    </div>
    <footer>Ih2</footer>
    <script>
        let adatok = JSON.parse(localStorage.getItem('nev')) || [];
        console.log(adatok);
        function kuldes()
        {
            let nev = document.getElementById("nev").value;
            let datum = document.getElementById("datum").value;
            adatok.push(nev,datum);
            //console.log(nev,datum);
            localStorage.setItem('nev',JSON.stringify(adatok));
            localStorage.setItem('datum',JSON.stringify(adatok));
            console.log(JSON.parse(localStorage.getItem('nev',)));
            console.log(JSON.parse(localStorage.getItem('datum')));
        }
    </script>
</body>
</html>
