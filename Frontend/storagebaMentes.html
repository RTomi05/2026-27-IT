<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <title>LocalStorage Számok</title>
    <style>
        input
        {
            margin: 30px;
        }
        label
        {
            margin: 30px;
        }
    </style>
</head>
<body>
        <label for="szam">Adj meg egy számot!</label>
        <input type="number" id="szam">
        <button onclick="kuldes()" class="btn btn-primary">Mentés</button>
        <button onclick="kiir()" class="btn btn-info">Lekérés</button>
        <button onclick="kiir()" class="btn btn-info">Törlés</button>

        <p id="eredmeny"></p>
    </div>

    <script>



        function kuldes() {
            let szam = Number(document.getElementById("szam").value);
            localStorage.setItem("szam", szam);
        }

        function kiir() {
            const szam = Number(localStorage.getItem("szam"));
            const tipus = szam % 2 === 0 ? "páros" : "páratlan";
            document.getElementById("eredmeny").textContent = `A mentett szám: ${szam} -> ${tipus}`;
        }

        function torles()
        {
            localStorage.clear();
        }
    </script>
</body>
</html>
